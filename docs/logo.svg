<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Logo Luma : iris de diaphragme à 7 lamelles, cœur rouge">
  <title>Luma — logo « Diaphragme »</title>
  <!-- Palette Chrome & cuir (Luma/Theme.swift) -->
  <defs>
    <linearGradient id="champagne" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5F2F0"/>
      <stop offset="1" stop-color="#DBD9D1"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#champagne)"/>
  <!-- Fût : trait centré sur r=40 (spec) -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#1A1A1A" stroke-width="7"/>
  <!-- 7 lamelles : segment (50,36)→(78.4,27.8) répété par rotation de 360/7° -->
  <g fill="none" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round">
    <path d="M50 36 L78.4 27.8"/>
    <path d="M50 36 L78.4 27.8" transform="rotate(51.4286 50 50)"/>
    <path d="M50 36 L78.4 27.8" transform="rotate(102.8571 50 50)"/>
    <path d="M50 36 L78.4 27.8" transform="rotate(154.2857 50 50)"/>
    <path d="M50 36 L78.4 27.8" transform="rotate(205.7143 50 50)"/>
    <path d="M50 36 L78.4 27.8" transform="rotate(257.1429 50 50)"/>
    <path d="M50 36 L78.4 27.8" transform="rotate(308.5714 50 50)"/>
  </g>
  <!-- Cœur : le point de mesure -->
  <circle cx="50" cy="50" r="5.5" fill="#BF382B"/>
</svg>
