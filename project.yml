name: Luma
options:
  bundleIdPrefix: com.michaelbernard69
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SJVC6ZJ4VT # Personal Team (michaelbernard69@gmail.com)
targets:
  Luma:
    type: application
    platform: iOS
    sources: [Luma]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Luma/Info.plist
      properties:
        CFBundleDisplayName: LUMA
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: >-
          Luma mesure la lumière de la scène avec la caméra pour calculer
          les réglages de ton Nikon FM2.
  LumaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LumaTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Luma
schemes:
  Luma:
    build:
      targets:
        Luma: all
        LumaTests: [test]
    test:
      targets: [LumaTests]
