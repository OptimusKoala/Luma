name: Luma
options:
  bundleIdPrefix: com.michaelbernard69
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    # Team ID du compte Apple Developer payant. Le remplacer ici et nulle part
    # ailleurs (voir docs/appstore/publication.md, étape 1).
    DEVELOPMENT_TEAM: AXVF69V3LL
    # Version publique (App Store) et numéro de build (unique par envoi).
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Luma:
    type: application
    platform: iOS
    sources: [Luma]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ne PAS forcer CODE_SIGN_IDENTITY ici : avec CODE_SIGN_STYLE=Automatic,
        # Xcode refuse une identité imposée (« conflicting provisioning
        # settings »). L'archive se signe en développement, puis
        # `xcodebuild -exportArchive` la resigne en distribution — c'est le
        # fonctionnement normal, et ça exige un profil de développement, donc
        # au moins un appareil enregistré dans l'équipe.
    info:
      path: Luma/Info.plist
      properties:
        CFBundleDisplayName: LUMA
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Aucun chiffrement propriétaire : évite le questionnaire d'export
        # à chaque envoi sur App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: >-
          Luma mesure la lumière de la scène avec la caméra pour calculer
          les réglages de ton Nikon FM2.
  LumaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LumaTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Luma
schemes:
  Luma:
    build:
      targets:
        Luma: all
        LumaTests: [test]
    test:
      targets: [LumaTests]
